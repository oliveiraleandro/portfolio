<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$page_title — $site_name</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon.png">
  <meta name="description" content="$description">
  <meta property="og:title" content="$page_title — $site_name">
  <meta property="og:description" content="$description">
  <meta property="og:type" content="website">
  <!-- TODO: definir domínio público para canonical e og:url; adicionar og:image com URL absoluta de um asset real. -->
  <link rel="stylesheet" href="../../css/cases/base.css">
  <link rel="stylesheet" href="../../css/cases/header.css">
  <link rel="stylesheet" href="../../css/cases/article.css">
  <script src="../../js/contact.js" defer></script>

  <meta property="og:locale" content="pt_BR">

  <link rel="stylesheet" href="../../css/cases/footer.css">
</head>
<body>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<header class="site-header container">
  <a href="../../" class="identity"><span>$site_name</span><span class="role">$site_role</span></a>
  <div class="header-actions">
    <a class="text-link home-link" href="../../"><span aria-hidden="true">←</span> Página inicial</a>
  </div>
</header>
<main id="conteudo"><article class="case cervello">
<header class="case-hero container"><img class="case-logo" src="logo.svg" alt="$alt_1" width="2468" height="512" decoding="async"><p class="eyebrow">$eyebrow</p><h1>$title</h1><p class="case-lead">$lead</p><ul class="tags">$tags</ul>
<div class="case-intro">
$body
</div>
</header>

<div class="case-body container">
<figure class="case-figure asset-gallery">
<div class="asset-gallery-images"><a class="figure-image-link" href="images/cervello.png" target="_blank" rel="noopener"><img src="images/cervello.png" alt="$alt_2" width="1210" height="553" loading="lazy" decoding="async"></a></div>
<figcaption>$caption_1</figcaption>
</figure>
<figure class="case-figure asset-gallery">
<div class="asset-gallery-images gallery-comparison"><a class="figure-image-link" href="images/modo-claro.png" target="_blank" rel="noopener"><img src="images/modo-claro.png" alt="$alt_3" width="588" height="588" loading="lazy" decoding="async"></a><a class="figure-image-link" href="images/modo-escuro.png" target="_blank" rel="noopener"><img src="images/modo-escuro.png" alt="$alt_4" width="588" height="588" loading="lazy" decoding="async"></a></div>
<figcaption>$caption_2</figcaption>
</figure>
<figure class="case-figure asset-gallery">
<div class="asset-gallery-images"><a class="figure-image-link" href="images/Group-2.png" target="_blank" rel="noopener"><img src="images/Group-2.png" alt="$alt_5" width="325" height="574" loading="lazy" decoding="async"></a><a class="figure-image-link" href="images/Group.png" target="_blank" rel="noopener"><img src="images/Group.png" alt="$alt_6" width="323" height="574" loading="lazy" decoding="async"></a><a class="figure-image-link" href="images/Group-1.png" target="_blank" rel="noopener"><img src="images/Group-1.png" alt="$alt_7" width="323" height="574" loading="lazy" decoding="async"></a></div>
<figcaption>$caption_3</figcaption>
</figure>
</div>
<nav class="next-case container" aria-label="$alt_8"><p class="eyebrow">Próximo case</p><a href="$next_url">$next_name</a></nav></article></main>
$footer
</body>
</html>
