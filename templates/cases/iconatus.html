<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$page_title — $site_name</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon.png">
  <meta name="description" content="$description">
  <meta property="og:title" content="$page_title — $site_name">
  <meta property="og:description" content="$description">
  <meta property="og:type" content="website">
  <!-- TODO: definir domínio público para canonical e og:url; adicionar og:image com URL absoluta de um asset real. -->
  <link rel="stylesheet" href="../../css/cases/base.css">
  <link rel="stylesheet" href="../../css/cases/header.css">
  <link rel="stylesheet" href="../../css/cases/article.css">
  <script src="../../js/contact.js" defer></script>

  <meta property="og:locale" content="pt_BR">

  <link rel="stylesheet" href="../../css/cases/footer.css">
</head>
<body>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<header class="site-header container">
  <a href="../../" class="identity"><span>$site_name</span><span class="role">$site_role</span></a>
  <div class="header-actions">
    <a class="text-link home-link" href="../../"><span aria-hidden="true">←</span> Página inicial</a>
  </div>
</header>
<main id="conteudo">
  <article class="case iconatus">
    <header class="case-hero container">
      <img class="case-logo" src="logo.svg" alt="$alt_1" width="267" height="99" decoding="async">
<p class="eyebrow">$eyebrow</p>
      <h1>$title</h1>
      <p class="case-lead">$lead</p>
      <ul class="tags">$tags</ul>
<div class="case-intro">
$body
</div>
</header>

    <div class="case-body container">
<figure class="case-figure case-opening">
  <a class="figure-image-link" href="images/imoveis%20-%20precificacao%20v2.png" target="_blank" rel="noopener"><img src="images/imoveis%20-%20precificacao%20v2.png" alt="$alt_2" width="1280" height="1148" loading="lazy" decoding="async"></a>
  <figcaption>$caption_1 <a href="images/imoveis%20-%20precificacao%20v2.png" target="_blank" rel="noopener">Abrir imagem completa</a></figcaption>
</figure>
<figure class="case-figure">
  <a class="figure-image-link" href="images/home%20v2.png" target="_blank" rel="noopener"><img src="images/home%20v2.png" alt="$alt_3" width="1280" height="1054" loading="lazy" decoding="async"></a>
  <figcaption>$caption_2 <a href="images/home%20v2.png" target="_blank" rel="noopener">Abrir imagem completa</a></figcaption>
</figure>
<div class="case-phone-pair">
<figure class="case-figure case-figure-mobile">
  <a class="figure-image-link" href="images/mobile%20home.png" target="_blank" rel="noopener"><img src="images/mobile%20home.png" alt="$alt_4" width="390" height="2116" loading="lazy" decoding="async"></a>
  <figcaption>$caption_3 <a href="images/mobile%20home.png" target="_blank" rel="noopener">Abrir imagem completa</a></figcaption>
</figure>
<figure class="case-figure case-figure-mobile">
  <a class="figure-image-link" href="images/mobile%20resultado.png" target="_blank" rel="noopener"><img src="images/mobile%20resultado.png" alt="$alt_5" width="390" height="1419" loading="lazy" decoding="async"></a>
  <figcaption>$caption_4 <a href="images/mobile%20resultado.png" target="_blank" rel="noopener">Abrir imagem completa</a></figcaption>
</figure>
</div>
<figure class="case-figure">
  <a class="figure-image-link" href="images/imoveis%20v2.png" target="_blank" rel="noopener"><img src="images/imoveis%20v2.png" alt="$alt_6" width="1280" height="939" loading="lazy" decoding="async"></a>
  <figcaption>$caption_5 <a href="images/imoveis%20v2.png" target="_blank" rel="noopener">Abrir imagem completa</a></figcaption>
</figure>
<figure class="case-figure case-figure-mobile">
  <a class="figure-image-link" href="images/mobile%20imo%CC%81vel.png" target="_blank" rel="noopener"><img src="images/mobile%20imo%CC%81vel.png" alt="$alt_7" width="390" height="2846" loading="lazy" decoding="async"></a>
  <figcaption>$caption_6 <a href="images/mobile%20imo%CC%81vel.png" target="_blank" rel="noopener">Abrir imagem completa</a></figcaption>
</figure>
</div>
<nav class="next-case container" aria-label="$alt_8"><p class="eyebrow">Próximo case</p><a href="$next_url">$next_name</a></nav>
  </article>
</main>
$footer
</body>
</html>
