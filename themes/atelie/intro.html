<div class="hero-panel">
  <picture>
    <source media="(max-width: 680px)" srcset="../../assets/hero-office-mobile.webp">
    <img class="hero-photo" src="../../assets/hero-office.webp" width="1412" height="941" alt="" fetchpriority="high">
  </picture>
  <section class="hero container" aria-labelledby="titulo">
    <div class="hero-copy">
      <h1 id="titulo">$before <mark>$emphasis</mark> $after</h1>
      <p class="hero-intro">$description</p>
    </div>
  </section>
</div>
