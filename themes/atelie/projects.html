<section class="project-band datacare" aria-labelledby="destaque">
  <div class="container project-layout">
    <div class="project-label"><span class="recent-label">$latest</span><span class="datacare-name">$featured_name</span></div>
    <div class="project-copy"><h2 id="destaque">$featured_title</h2><p>$featured_description</p>
      <ul class="tags">$tag_items</ul>
      <a class="text-link" href="$featured_url">Ver case completo <span class="case-arrow" aria-hidden="true">→</span></a>
    </div>
    <figure class="project-art art-sebrae"><img class="feature-screen" src="$featured_image" alt="$featured_alt" loading="lazy"><a class="project-art-link" href="$featured_url" aria-label="$featured_name"></a></figure>
  </div>
</section>
<section class="project-archive container" aria-labelledby="anteriores">
  <h2 id="anteriores">$archive_label</h2>
  <ul>$cards</ul>
</section>
<section class="project-band portfolio-evolution" aria-labelledby="experimento">
  <div class="container project-layout">
    <div class="project-label">$experiment_name</div>
    <div class="project-copy"><h2 id="experimento">$experiment_title</h2><p>$experiment_description</p>
      <a class="text-link" href="$experiment_url">Conhecer o experimento <span class="case-arrow" aria-hidden="true">→</span></a>
    </div>
    <figure class="project-art art-sebrae"><img class="feature-screen" src="$experiment_image" alt="$experiment_alt" loading="lazy"><a class="project-art-link" href="$experiment_url" aria-label="$experiment_name"></a></figure>
  </div>
</section>
