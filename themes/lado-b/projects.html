<section class="panel featured" aria-labelledby="destaque">
  <div class="titlebar"><span>$latest</span></div>
  <div class="project-body">
    <img src="$featured_image" alt="$featured_alt">
    <div><h2 id="destaque"><a href="$featured_url">$featured_name</a></h2>
      <p>$featured_title</p><p>$featured_description</p>
      <p class="tags">$tags</p></div>
  </div>
</section>
<section class="panel archive" aria-labelledby="anteriores">
  <div class="titlebar"><h2 id="anteriores">$archive_label</h2></div>
  <ul>$cards</ul>
</section>
<section class="panel experiment" aria-labelledby="experimento">
  <div class="titlebar"><h2 id="experimento"><a href="$experiment_url">$experiment_name</a></h2></div>
  <p><a href="$experiment_url">$experiment_title</a> $experiment_description</p>
</section>
