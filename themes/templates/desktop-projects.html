<section class="window project featured" aria-labelledby="destaque">
  <div class="titlebar"><span>$featured_name · $latest</span></div>
  <div class="project-body"><div class="copy">
    <h2 id="destaque"><a href="$featured_url">$featured_title</a></h2>
    <p>$featured_description</p>
    <p class="tags">$tags</p>
  </div><a class="project-image" href="$featured_url" aria-label="$featured_name"><img src="$featured_image" alt="$featured_alt"></a></div>
</section>
<section class="window archive" aria-labelledby="anteriores">
  <div class="titlebar"><h2 id="anteriores">$archive_label</h2></div>
  <ul>$cards</ul>
</section>
<section class="window project" aria-labelledby="experimento">
  <div class="titlebar"><span>$experiment_name</span></div>
  <div class="project-body"><div class="copy">
    <h2 id="experimento"><a href="$experiment_url">$experiment_title</a></h2>
    <p>$experiment_description</p>
  </div><a class="project-image" href="$experiment_url" aria-label="$experiment_name"><img src="$experiment_image" alt="$experiment_alt" loading="lazy"></a></div>
</section>
