<section class="featured" aria-labelledby="destaque">
  <h2 id="destaque">$latest</h2>
  <div class="feature-body"><div>
    <h3><a href="$featured_url">$featured_name</a></h3>
    <p class="subtitle">$featured_title</p>
    <p>$featured_description</p>
    <p class="tags">$tags</p>
  </div><img src="$featured_image" alt="$featured_alt" loading="lazy"></div>
</section>
<section class="archive" aria-labelledby="anteriores">
  <h2 id="anteriores">$archive_label</h2>
  <ul>$cards</ul>
</section>
<section class="experiment" aria-labelledby="experimento">
  <h2 id="experimento">$experiment_name</h2>
  <p><a href="$experiment_url">$experiment_title</a></p>
  <p>$experiment_description</p>
</section>
