<section aria-labelledby="projetos">
  <h2 class="section-title" id="projetos">$projects_label</h2>
  <div class="collection">
    <article class="feature">
      <a class="feature-image" href="$featured_url" aria-label="$featured_name"><img src="$featured_image" alt="$featured_alt"></a>
      <div class="feature-copy"><p class="meta">$featured_name <span>· $latest</span></p>
        <h3><a href="$featured_url">$featured_title</a></h3>
        <p>$featured_description</p>
        <p class="tags">$tags</p>
      </div>
    </article>
    <aside aria-labelledby="anteriores"><h3 id="anteriores">$archive_label</h3>
      <div class="albums">$cards</div>
    </aside>
  </div>
</section>
<article class="experiment">
  <img src="$experiment_image" alt="$experiment_alt" loading="lazy">
  <div><p class="meta">$experiment_name</p>
    <h3><a href="$experiment_url">$experiment_title</a></h3>
    <p>$experiment_description</p>
  </div>
</article>
